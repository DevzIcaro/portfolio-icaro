<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="1" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="accent" x1="40" y1="24" x2="88" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#248C7B"/>
      <stop offset="1" stop-color="#8A248C"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="url(#accent)" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Circuito / detalhe tech -->
  <g stroke="#248C7B" stroke-width="2.5" stroke-linecap="round" opacity="0.45">
    <path d="M24 40 H36"/>
    <path d="M24 64 H32"/>
    <path d="M24 88 H36"/>
    <path d="M104 40 H92"/>
    <path d="M104 64 H96"/>
    <path d="M104 88 H92"/>
  </g>
  <g fill="#8A248C" opacity="0.7">
    <circle cx="36" cy="40" r="3"/>
    <circle cx="32" cy="64" r="3"/>
    <circle cx="36" cy="88" r="3"/>
    <circle cx="92" cy="40" r="3"/>
    <circle cx="96" cy="64" r="3"/>
    <circle cx="92" cy="88" r="3"/>
  </g>

  <!-- Letra I -->
  <g fill="url(#accent)">
    <rect x="46" y="34" width="36" height="11" rx="3.5"/>
    <rect x="58.5" y="34" width="11" height="60" rx="3.5"/>
    <rect x="46" y="83" width="36" height="11" rx="3.5"/>
  </g>
</svg>
