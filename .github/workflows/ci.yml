name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Build, start preview e rodar Cypress E2E
        uses: cypress-io/github-action@v6
        with:
          install-command: pnpm install --frozen-lockfile
          build: pnpm run build
          start: pnpm run preview
          wait-on: 'http://localhost:4321/portfolio-icaro/'
          browser: chrome

      - name: Upload de screenshots do Cypress (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
